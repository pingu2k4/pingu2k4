name: Update profile cards

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Fetch complete NuGet gallery totals
        shell: pwsh
        run: ./scripts/get-nuget-stats.ps1 -Destination "$env:RUNNER_TEMP/nuget.json"

      - name: Refresh authenticated activity cards
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: ./scripts/update-activity-cards.ps1 -NuGetStatsPath "$env:RUNNER_TEMP/nuget.json"

      - name: Refresh featured project cards
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/update-project-cards.ps1 -NuGetStatsPath "$env:RUNNER_TEMP/nuget.json"

      - name: Commit updated cards
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cards/*.svg assets/projects/*.svg scripts/activity-calendar.json README.md
          if ! git diff --cached --quiet; then
            git commit -m "Update profile cards"
            git push
          fi
