name: Update profile cards

on:
  schedule:
    - cron: "17 3 * * *"
    - cron: "43 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Report refresh trigger
        shell: pwsh
        env:
          REFRESH_EVENT: ${{ github.event_name }}
          REFRESH_SCHEDULE: ${{ github.event.schedule }}
        run: |
          $message = "Trigger: $env:REFRESH_EVENT; cron: $env:REFRESH_SCHEDULE; started: $([DateTime]::UtcNow.ToString('o')). Scheduled times are UTC; GitHub may delay delivery."
          Write-Output $message
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $message

      - name: Verify profile card generation
        shell: pwsh
        run: |
          ./scripts/test-profile-cards.ps1
          ./scripts/test-email-card.ps1
          ./scripts/test-light-assets.ps1

      - name: Fetch complete NuGet gallery totals
        shell: pwsh
        run: ./scripts/get-nuget-stats.ps1 -Destination "$env:RUNNER_TEMP/nuget.json"

      - name: Refresh activity cards
        shell: pwsh
        env:
          PROFILE_STATS_APP_ID: ${{ vars.PROFILE_STATS_APP_ID }}
          PROFILE_STATS_APP_PRIVATE_KEY: ${{ secrets.PROFILE_STATS_APP_PRIVATE_KEY }}
        run: ./scripts/update-activity-cards.ps1 -NuGetStatsPath "$env:RUNNER_TEMP/nuget.json"

      - name: Refresh featured project cards
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/update-project-cards.ps1 -NuGetStatsPath "$env:RUNNER_TEMP/nuget.json"

      - name: Generate email statistics card
        shell: pwsh
        run: |
          ./scripts/update-email-card.ps1 -NuGetStatsPath "$env:RUNNER_TEMP/nuget.json"
          $node = (Get-Command node).Source
          $npm = (Get-Command npm).Source
          & $npm install --prefix "$env:RUNNER_TEMP/email-renderer" --no-save --package-lock=false --ignore-scripts --no-bin-links --no-audit --no-fund '@resvg/resvg-js@2.6.2'
          if ($LASTEXITCODE -ne 0) { throw 'Email renderer installation failed.' }
          & $node ./scripts/render-email-card.cjs "$env:RUNNER_TEMP/email-renderer" ./assets/email/stats.svg ./assets/email/stats.png
          if ($LASTEXITCODE -ne 0) { throw 'Email PNG rendering failed.' }

      - name: Generate light README variants
        shell: pwsh
        run: ./scripts/update-light-assets.ps1

      - name: Commit updated cards
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hero*-light.svg assets/hero*-themed.svg assets/skills/*-light.svg assets/cards/*.svg assets/projects/*.svg assets/email/stats.svg assets/email/stats.png scripts/activity-calendar.json README.md
          if ! git diff --cached --quiet; then
            git commit -m "Update profile cards"
            git push
          fi
